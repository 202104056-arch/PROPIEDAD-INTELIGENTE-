<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROP CODE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#f5f7fb;
  color:#0c1633;
}

header{
  width:100%;
  background:white;
  border-bottom:1px solid #e5e7eb;
  padding:18px 70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:30px;
  font-weight:800;
}

.logo span{
  color:#1976ff;
}

.logo-box{
  width:45px;
  height:45px;
  background:#1976ff;
  border-radius:12px;
}

nav{
  display:flex;
  gap:40px;
}

nav a{
  text-decoration:none;
  color:#445;
  font-weight:500;
}

.buttons{
  display:flex;
  gap:15px;
}

.login{
  text-decoration:none;
  color:#111827;
  font-weight:600;
}

.agent{
  background:#1976ff;
  color:white;
  padding:12px 22px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
}

.hero{
  min-height:85vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px 20px;
}

.tag{
  border:1px solid #b9d3ff;
  color:#1976ff;
  background:#eef5ff;
  padding:10px 22px;
  border-radius:999px;
  font-weight:500;
  margin-bottom:35px;
}

.hero h1{
  font-size:78px;
  line-height:1.05;
  max-width:1000px;
  font-weight:800;
  margin-bottom:25px;
}

.hero h1 span{
  color:#1976ff;
}

.hero p{
  max-width:900px;
  font-size:30px;
  color:#4b5563;
}

.mapa{
  padding:80px 40px;
  background:white;
  text-align:center;
}

.mapa h2{
  font-size:45px;
  margin-bottom:25px;
}

.leyenda{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}

.color{
  width:18px;
  height:18px;
  border-radius:50%;
}

.rojo{background:red;}
.azul{background:blue;}
.verde{background:green;}

#map{
  width:90%;
  height:600px;
  margin:auto;
  border-radius:25px;
}

.pin{
  width:20px;
  height:20px;
  border-radius:50%;
  border:3px solid white;
}

.pin-rojo{
  background:red;
}

.pin-azul{
  background:blue;
}

.pin-verde{
  background:green;
}

html{
  scroll-behavior:smooth;
}

</style>

</head>

<body>

<header>

  <div class="logo">
    <div class="logo-box"></div>
    PROP <span>CODE</span>
  </div>

  <nav>
    <a href="#">Quiénes somos</a>
    <a href="#mapa">Beneficios</a>
  </nav>

  <div class="buttons">
    <a href="#" class="login">Entrar como Usuario</a>
    <a href="#" class="agent">Entrar como Agente</a>
  </div>

</header>

<section class="hero">

  <div class="tag">
    Plataforma inmobiliaria de Cochabamba
  </div>

  <h1>
    Encuentra tu próxima
    propiedad en <span>PROP CODE</span>
  </h1>

  <p>
    Anticrético, alquiler o compra en Cochabamba.
  </p>

</section>

<section class="mapa" id="mapa">

  <h2>Mapa interactivo</h2>

  <div class="leyenda">

    <div class="item">
      <div class="color rojo"></div>
      Anticrético
    </div>

    <div class="item">
      <div class="color azul"></div>
      Alquiler
    </div>

    <div class="item">
      <div class="color verde"></div>
      Venta
    </div>

  </div>

  <div id="map"></div>

</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-17.3935, -66.1570], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'PROP CODE'
}).addTo(map);

function crearPin(colorClase){

  return L.divIcon({
    className:'',
    html:`<div class="pin ${colorClase}"></div>`,
    iconSize:[20,20]
  });

}

const rojo = crearPin('pin-rojo');
const azul = crearPin('pin-azul');
const verde = crearPin('pin-verde');

L.marker([-17.3835, -66.1500], {icon: rojo})
.addTo(map)
.bindPopup("Anticrético en Cala Cala");

L.marker([-17.4000, -66.1700], {icon: azul})
.addTo(map)
.bindPopup("Departamento en alquiler");

L.marker([-17.3700, -66.1400], {icon: verde})
.addTo(map)
.bindPopup("Casa en venta");

L.marker([-17.3950, -66.1300], {icon: rojo})
.addTo(map)
.bindPopup("Anticrético zona norte");

L.marker([-17.4100, -66.1600], {icon: azul})
.addTo(map)
.bindPopup("Alquiler temporal");

L.marker([-17.3850, -66.1800], {icon: verde})
.addTo(map)
.bindPopup("Terreno en venta");

</script>

</body>
</html>
