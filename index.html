<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROP CODE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#f5f7fb;
      color:#0c1633;
    }

    /* NAVBAR */

    header{
      width:100%;
      background:white;
      border-bottom:1px solid #e5e7eb;
      padding:18px 70px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:30px;
      font-weight:800;
    }

    .logo span{
      color:#1976ff;
    }

    .logo-box{
      width:45px;
      height:45px;
      background:#1976ff;
      border-radius:12px;
    }

    nav{
      display:flex;
      gap:40px;
    }

    nav a{
      text-decoration:none;
      color:#445;
      font-weight:500;
      transition:0.3s;
    }

    nav a:hover{
      color:#1976ff;
    }

    .buttons{
      display:flex;
      gap:15px;
      align-items:center;
    }

    .login{
      text-decoration:none;
      color:#111827;
      font-weight:600;
    }

    .agent{
      background:#1976ff;
      color:white;
      padding:12px 22px;
      border-radius:12px;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    .agent:hover{
      background:#005ce6;
    }

    /* HERO */

    .hero{
      min-height:85vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:40px 20px;
    }

    .tag{
      border:1px solid #b9d3ff;
      color:#1976ff;
      background:#eef5ff;
      padding:10px 22px;
      border-radius:999px;
      font-weight:500;
      margin-bottom:35px;
    }

    .hero h1{
      font-size:78px;
      line-height:1.05;
      max-width:1000px;
      font-weight:800;
      margin-bottom:25px;
    }

    .hero h1 span{
      color:#1976ff;
    }

    .hero p{
      max-width:900px;
      font-size:32px;
      color:#4b5563;
      line-height:1.6;
    }

    /* RESPONSIVE */

    @media(max-width:1000px){

      header{
        flex-direction:column;
        gap:20px;
      }

      nav{
        flex-wrap:wrap;
        justify-content:center;
      }

      .hero h1{
        font-size:52px;
      }

      .hero p{
        font-size:22px;
      }

    }

  </style>

</head>

<body>

  <header>

    <div class="logo">
      <div class="logo-box"></div>
      PROP <span>CODE</span>
    </div>

    <nav>
      <a href="#">Quiénes somos</a>
      <a href="#">Beneficios</a>
    </nav>

    <div class="buttons">
      <a href="#" class="login">Entrar como Usuario</a>
      <a href="#" class="agent">Entrar como Agente</a>
    </div>

  </header>

  <section class="hero">

    <div class="tag">
       Plataforma inmobiliaria de Cochabamba
    </div>

    <h1>
      Encuentra tu próxima
      propiedad en <span>PROP CODE</span>
    </h1>

    <p>
      Anticrético, alquiler o compra. Explora propiedades en Cochabamba
      con un mapa interactivo, filtros inteligentes y agentes verificados.
    </p>

  </section>

</body>
</html>
