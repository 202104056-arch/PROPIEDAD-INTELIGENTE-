<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Página Azul</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e3a8a; /* azul */
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn1 {
      background: white;
      color: #1e3a8a;
    }

    .btn1:hover {
      background: #e2e8f0;
    }

    .btn2 {
      background: #38bdf8;
      color: white;
    }

    .btn2:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>

  <h1>Bienvenido a mi página</h1>

  <div class="buttons">
    <button class="btn1">Quiénes Somos</button>
    <button class="btn2">Beneficios</button>
  </div>

</body>
</html>
