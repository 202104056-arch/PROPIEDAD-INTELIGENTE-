<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROP CODE</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  display:flex;
  background:#f5f5f5;
}

/* ================= SIDEBAR ================= */

.sidebar{

  width:230px;
  height:100vh;
  background:white;

  padding:30px 20px;

  box-shadow:0 0 10px rgba(0,0,0,.1);
}

.logo{

  font-size:45px;
  font-weight:bold;

  margin-bottom:50px;
}

.logo span{
  color:#2563eb;
}

.menu{

  display:flex;
  flex-direction:column;
  gap:35px;
}

.menu a{

  text-decoration:none;
  color:#334155;

  font-size:22px;
  font-weight:bold;

  transition:.3s;
}

.menu a:hover{

  color:#2563eb;
  transform:translateX(5px);
}

/* ================= MAIN ================= */

.main{

  flex:1;
  padding:25px;
}

/* ================= FILTROS ================= */

.filtros{

  display:flex;
  gap:15px;

  flex-wrap:wrap;

  margin-bottom:25px;
}

.filtros input,
.filtros select,
.filtros button{

  padding:15px;

  border-radius:14px;

  border:1px solid #d1d5db;

  min-width:170px;

  font-size:15px;
}

.filtros input:focus,
.filtros select:focus{

  outline:none;
  border:1px solid #2563eb;
}

.filtros button{

  background:#2563eb;
  color:white;

  border:none;

  cursor:pointer;

  font-weight:bold;

  transition:.3s;
}

.filtros button:hover{

  background:#1d4ed8;
}

/* ================= MAPA ================= */

.map-container{

  position:relative;
}

#map{

  height:82vh;

  border-radius:25px;

  overflow:hidden;
}

/* ================= TARJETA ================= */

.card{

  position:absolute;

  top:20px;
  right:20px;

  width:350px;

  background:white;

  border-radius:25px;

  overflow:hidden;

  box-shadow:0 10px 30px rgba(0,0,0,.15);

  display:none;

  z-index:1000;
}

.card img{

  width:100%;
  height:220px;

  object-fit:cover;
}

.card-body{

  padding:20px;
}

.tipo{

  display:inline-block;

  padding:8px 15px;

  border-radius:20px;

  background:#dcfce7;

  color:green;

  font-weight:bold;
}

.precio{

  font-size:42px;

  color:#2563eb;

  font-weight:bold;

  margin:15px 0;
}

.detalles{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  margin:20px 0;
}

.detalle{

  background:#f1f5f9;

  padding:15px;

  border-radius:12px;
}

.descripcion{

  color:#64748b;

  line-height:1.6;

  margin-top:15px;
}

.btn{

  width:100%;

  margin-top:20px;

  padding:15px;

  border:none;

  border-radius:12px;

  background:#2563eb;

  color:white;

  font-weight:bold;

  cursor:pointer;

  transition:.3s;
}

.btn:hover{

  background:#1d4ed8;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1200px){

  body{
    flex-direction:column;
  }

  .sidebar{

    width:100%;
    height:auto;
  }

  #map{
    height:70vh;
  }

  .card{

    position:relative;

    width:100%;

    top:20px;
    right:0;
  }

}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

  <div class="logo">
    PROP <span>CODE</span>
  </div>

  <div class="menu">

    <a href="#">🏠 Inicio</a>

    <a href="#">❤️ Favoritos</a>

    <a href="#">📍 Mapa</a>

    <a href="#">⚖️ Comparador</a>

    <a href="#">👤 Perfil</a>

  </div>

</div>

<!-- ================= CONTENIDO ================= -->

<div class="main">

  <!-- FILTROS -->

  <div class="filtros">

    <input type="text" placeholder="📍 Ubicación">

    <!-- NUEVO FILTRO ZONA -->
    <select id="zona">

      <option value="todas">
        Zona
      </option>

      <option value="norte">
        Norte
      </option>

      <option value="sur">
        Sur
      </option>

      <option value="centro">
        Centro
      </option>

      <option value="oeste">
        Oeste
      </option>

      <option value="este">
        Este
      </option>

    </select>

    <select id="tipo">

      <option value="todos">
        Tipo inmobiliario
      </option>

      <option value="venta">
        Venta
      </option>

      <option value="alquiler">
        Alquiler
      </option>

      <option value="anticretico">
        Anticrético
      </option>

    </select>

    <select>

      <option>
        Tipo de vivienda
      </option>

      <option>
        Casa
      </option>

      <option>
        Departamento
      </option>

      <option>
        Oficina
      </option>

    </select>

    <input type="number"
    placeholder="Precio mínimo">

    <input type="number"
    placeholder="Precio máximo">

    <select>

      <option>
        # Habitaciones
      </option>

      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4+</option>

    </select>

    <button onclick="filtrar()">
      Buscar
    </button>

  </div>

  <!-- MAPA -->

  <div class="map-container">

    <div id="map"></div>

    <!-- TARJETA -->

    <div class="card" id="card">

      <img id="imgCasa"
      src="">

      <div class="card-body">

        <div class="tipo"
        id="tipoCasa">
          Venta
        </div>

        <div class="precio"
        id="precioCasa">
          $120.000
        </div>

        <div class="detalles">

          <div class="detalle">
            🛏 3 habitaciones
          </div>

          <div class="detalle">
            🚿 2 baños
          </div>

          <div class="detalle">
            📐 240m²
          </div>

          <div class="detalle">
            🚗 Garaje
          </div>

        </div>

        <p class="descripcion">
          Hermosa propiedad moderna ubicada
          cerca de supermercados y transporte.
        </p>

        <button class="btn">
          Guardar favorito
        </button>

      </div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* ================= MAPA ================= */

let map = L.map('map')
.setView([-17.393,-66.157],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  attribution:'PROP CODE'
}
).addTo(map);

/* ================= DATOS ================= */

let propiedades = [

{
  titulo:"Casa Norte",
  tipo:"venta",
  zona:"norte",
  precio:"$120.000",

  lat:-17.385,
  lng:-66.145,

  color:"green",

  img:"https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200&auto=format&fit=crop"
},

{
  titulo:"Departamento Centro",
  tipo:"alquiler",
  zona:"centro",
  precio:"$80.000",

  lat:-17.393,
  lng:-66.157,

  color:"blue",

  img:"https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200&auto=format&fit=crop"
},

{
  titulo:"Casa Sur",
  tipo:"anticretico",
  zona:"sur",
  precio:"$95.000",

  lat:-17.405,
  lng:-66.170,

  color:"red",

  img:"https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=1200&auto=format&fit=crop"
},

{
  titulo:"Casa Oeste",
  tipo:"venta",
  zona:"oeste",
  precio:"$150.000",

  lat:-17.390,
  lng:-66.185,

  color:"green",

  img:"https://images.unsplash.com/photo-1600585154526-990dced4db0d?q=80&w=1200&auto=format&fit=crop"
}

];

let markers = [];

/* ================= ICONOS ================= */

function crearIcono(color){

  return L.divIcon({

    html:`
      <div style="
        background:${color};
        width:18px;
        height:18px;
        border-radius:50%;
        border:3px solid white;
        box-shadow:0 0 10px rgba(0,0,0,.3);
      "></div>
    `,

    className:""

  });

}

/* ================= MOSTRAR ================= */

function mostrar(data){

  markers.forEach(m=>map.removeLayer(m));

  markers=[];

  data.forEach(p=>{

    let marker = L.marker(
      [p.lat,p.lng],
      {
        icon:crearIcono(p.color)
      }
    ).addTo(map);

    marker.on('click',()=>{

      let card =
      document.getElementById("card");

      // TOGGLE
      if(card.style.display==="block"){

        card.style.display="none";

      }else{

        card.style.display="block";

        document.getElementById("precioCasa")
        .innerHTML = p.precio;

        document.getElementById("tipoCasa")
        .innerHTML = p.tipo;

        document.getElementById("imgCasa")
        .src = p.img;

      }

    });

    markers.push(marker);

  });

}

/* ================= FILTRAR ================= */

function filtrar(){

  let tipo =
  document.getElementById("tipo").value;

  let zona =
  document.getElementById("zona").value;

  let filtradas = propiedades.filter(p=>{

    let okTipo =
      tipo==="todos" || p.tipo===tipo;

    let okZona =
      zona==="todas" || p.zona===zona;

    return okTipo && okZona;

  });

  mostrar(filtradas);

  // ocultar tarjeta al filtrar
  document.getElementById("card")
  .style.display="none";
}

/* ================= INICIO ================= */

mostrar(propiedades);

</script>

</body>
</html>
