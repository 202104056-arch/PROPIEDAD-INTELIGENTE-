<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa interactivo | PROP CODE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#f5f7fb;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:280px;
  height:100vh;
  background:white;
  border-right:1px solid #e5e7eb;
  padding:35px 25px;
  position:fixed;
  left:0;
  top:0;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu a{
  text-decoration:none;
  color:#334155;
  padding:14px;
  border-radius:12px;
  font-weight:600;
}

.menu a:hover{
  background:#eef5ff;
}

/* MAIN */
.main{
  margin-left:280px;
  width:calc(100% - 280px);
  padding:20px;
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-size:28px;
}

/* FILTROS */
.filtros{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:20px;
}

.filtros input,
.filtros select{
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.filtros button{
  padding:10px 18px;
  border:none;
  background:#1976ff;
  color:white;
  border-radius:10px;
  cursor:pointer;
}

/* LEYENDA */
.leyenda{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:10px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
}

/* MAPA */
.mapa{
  background:white;
  padding:15px;
  border-radius:20px;
}

#map{
  width:100%;
  height:75vh;
  border-radius:15px;
}

/* PINES */
.pin{
  width:16px;
  height:16px;
  border-radius:50%;
  border:2px solid white;
}

.rojo{background:red;}
.azul{background:blue;}
.verde{background:green;}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="menu">
    <a>🏠 Inicio</a>
    <a>❤ Favoritos</a>
    <a>📍 Mapa</a>
    <a>⚖ Comparador</a>
    <a>👤 Perfil</a>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <h1>Mapa interactivo</h1>
  </div>

  <!-- FILTROS -->
  <div class="filtros">

    <input id="ubicacion" placeholder="Ubicación">

    <select id="tipo">
      <option value="">Tipo inmueble</option>
      <option value="Casa">Casa</option>
      <option value="Departamento">Departamento</option>
    </select>

    <input id="min" type="number" placeholder="Precio mínimo">
    <input id="max" type="number" placeholder="Precio máximo">

    <select id="hab">
      <option value="">Habitaciones</option>
      <option value="1">1+</option>
      <option value="2">2+</option>
      <option value="3">3+</option>
    </select>

    <button onclick="filtrar()">Buscar</button>

  </div>

  <!-- LEYENDA -->
  <div class="leyenda">
    <div><span class="dot" style="background:red"></span>Anticrético</div>
    <div><span class="dot" style="background:blue"></span>Alquiler</div>
    <div><span class="dot" style="background:green"></span>Venta</div>
  </div>

  <!-- MAPA -->
  <div class="mapa">
    <div id="map"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-17.3935, -66.1570], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'PROP CODE'
}).addTo(map);

/* ===== ZONAS (NUEVO) ===== */
const zonas = [
  {nombre:"Centro", color:"red", coords:[-17.3935,-66.1570], radio:1200},
  {nombre:"Norte", color:"blue", coords:[-17.3700,-66.1400], radio:1000},
  {nombre:"Sur", color:"green", coords:[-17.4200,-66.1800], radio:1500}
];

zonas.forEach(z=>{
  L.circle(z.coords,{
    color:z.color,
    fillColor:z.color,
    fillOpacity:0.15,
    radius:z.radio
  }).addTo(map).bindPopup(z.nombre);
});

/* ===== PROPIEDADES ===== */
const propiedades = [
  {lat:-17.3835,lng:-66.1500,tipo:"Casa",precio:120000,hab:3,color:"rojo"},
  {lat:-17.4000,lng:-66.1700,tipo:"Departamento",precio:80000,hab:2,color:"azul"},
  {lat:-17.3700,lng:-66.1400,tipo:"Casa",precio:200000,hab:4,color:"verde"}
];

let markers=[];

function pintar(lista){

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  lista.forEach(p=>{
    const icon = L.divIcon({
      className:"",
      html:`<div class="pin ${p.color}"></div>`
    });

    let m = L.marker([p.lat,p.lng],{icon}).addTo(map);
    markers.push(m);
  });
}

pintar(propiedades);

/* ===== FILTRO ===== */
function filtrar(){

  let tipo = document.getElementById("tipo").value;
  let min = parseInt(document.getElementById("min").value)||0;
  let max = parseInt(document.getElementById("max").value)||9999999;
  let hab = parseInt(document.getElementById("hab").value)||0;

  let result = propiedades.filter(p =>
    (tipo=="" || p.tipo==tipo) &&
    p.precio>=min &&
    p.precio<=max &&
    p.hab>=hab
  );

  pintar(result);
}

</script>

</body>
</html>
