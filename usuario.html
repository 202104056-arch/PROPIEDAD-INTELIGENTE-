<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuario | PROP CODE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

/* ===== BASE ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#f5f7fb;
  display:flex;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:280px;
  height:100vh;
  background:white;
  border-right:1px solid #e5e7eb;
  padding:35px 25px;
  position:fixed;
  left:0;
  top:0;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu a{
  text-decoration:none;
  color:#334155;
  padding:14px;
  border-radius:12px;
  font-weight:600;
}

.menu a:hover{
  background:#eef5ff;
  color:#1976ff;
}

/* ===== MAIN ===== */
.main{
  margin-left:280px;
  width:calc(100% - 280px);
  padding:30px;
}

/* ===== MAPA ===== */
#map{
  width:100%;
  height:75vh;
  border-radius:20px;
}

/* ===== PINES ===== */
.pin{
  width:20px;
  height:20px;
  border-radius:50%;
  border:3px solid white;
}

.pin-rojo{background:red;}
.pin-azul{background:blue;}
.pin-verde{background:green;}

/* ===== CARD ===== */
.card-propiedad{
  position:fixed;
  right:20px;
  bottom:20px;
  width:350px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.25);
  display:none;
}

.card-propiedad img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.contenido-card{
  padding:15px;
}

.precio{
  color:#1976ff;
  font-size:32px;
  font-weight:800;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.info-item{
  background:#f5f7fb;
  padding:10px;
  border-radius:10px;
}

.btn-favorito{
  width:100%;
  margin-top:15px;
  padding:12px;
  background:#1976ff;
  color:white;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="menu">

    <a href="#">🏠 Inicio</a>

    <!-- 🔥 ARREGLADO -->
    <a href="./favoritos.html">❤ Favoritos</a>

    <a href="#">📍 Mapa</a>

    <a href="#">⚖ Comparador</a>

    <a href="#">👤 Perfil</a>

  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div id="map"></div>

</div>

<!-- CARD -->
<div class="card-propiedad" id="card">

  <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200">

  <div class="contenido-card">

    <h2>Casa Cala Cala</h2>

    <h1 class="precio">$120.000</h1>

    <div class="info-grid">

      <div class="info-item">🏠 Casa</div>
      <div class="info-item">📐 240 m²</div>
      <div class="info-item">🛏 3 habitaciones</div>
      <div class="info-item">🚿 2 baños</div>

    </div>

    <!-- 🔥 BOTÓN FAVORITO FUNCIONAL -->
    <button class="btn-favorito" onclick="guardarFavorito()">
      ❤ Guardar favorito
    </button>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAPA */
const map = L.map('map').setView([-17.3935, -66.1570], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'PROP CODE'
}).addTo(map);

/* PINES */
function crearPin(color){
  return L.divIcon({
    className:'',
    html:`<div class="pin ${color}"></div>`,
    iconSize:[20,20]
  });
}

const rojo = crearPin('pin-rojo');
const azul = crearPin('pin-azul');
const verde = crearPin('pin-verde');

/* CARD */
const card = document.getElementById("card");

function mostrarCard(){
  card.style.display = card.style.display === "block" ? "none" : "block";
}

/* 🔥 FAVORITOS (FUNCIONAL) */
function guardarFavorito(){

  const propiedad = {
    titulo: "Casa Cala Cala",
    precio: 120000,
    tipo: "Casa",
    habitaciones: 3,
    baños: 2,
    imagen: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200"
  };

  let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

  favoritos.push(propiedad);

  localStorage.setItem("favoritos", JSON.stringify(favoritos));

  alert("❤️ Guardado en favoritos");
}

/* GLOBAL */
window.guardarFavorito = guardarFavorito;

/* MARKERS */
L.marker([-17.3835, -66.1500], {icon: rojo}).addTo(map).on('click', mostrarCard);
L.marker([-17.4000, -66.1700], {icon: azul}).addTo(map).on('click', mostrarCard);
L.marker([-17.3700, -66.1400], {icon: verde}).addTo(map).on('click', mostrarCard);

</script>

</body>
</html>
