<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PROP CODE | Mapa con filtros</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family: Arial;
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#fff;
  padding:20px;
  border-right:1px solid #eee;
}

.input{
  width:100%;
  margin:8px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  background:#1677ff;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* MAPA */
#map{
  flex:1;
  height:100%;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Filtros</h3>

  <select id="tipo" class="input">
    <option value="">Tipo de propiedad</option>
    <option value="casa">Casa</option>
    <option value="depa">Departamento</option>
  </select>

  <input id="precio" class="input" type="number" placeholder="Precio máximo">
  <input id="hab" class="input" type="number" placeholder="Habitaciones mínimas">

  <button onclick="filtrar()">Aplicar filtros</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ---------------- MAPA ----------------
const map = L.map('map').setView([-17.393, -66.157], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ---------------- DATOS SIMULADOS ----------------
const propiedades = [
  {id:1, tipo:"casa", precio:120000, hab:3, lat:-17.39, lng:-66.15},
  {id:2, tipo:"depa", precio:80000, hab:2, lat:-17.40, lng:-66.16},
  {id:3, tipo:"casa", precio:200000, hab:5, lat:-17.41, lng:-66.14}
];

let markers = [];

// ---------------- MOSTRAR MARCADORES ----------------
function render(data){
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  data.forEach(p => {
    const marker = L.marker([p.lat, p.lng])
      .addTo(map)
      .bindPopup(`
        <b>${p.tipo}</b><br>
        Precio: ${p.precio}<br>
        Habitaciones: ${p.hab}
      `);

    markers.push(marker);
  });
}

// inicial
render(propiedades);

// ---------------- FILTRO ----------------
function filtrar(){
  const tipo = document.getElementById("tipo").value;
  const precio = document.getElementById("precio").value;
  const hab = document.getElementById("hab").value;

  const filtrados = propiedades.filter(p => {

    return (
      (tipo === "" || p.tipo === tipo) &&
      (precio === "" || p.precio <= parseInt(precio)) &&
      (hab === "" || p.hab >= parseInt(hab))
    );
  });

  render(filtrados);
}
</script>

</body>
</html>
