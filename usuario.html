<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa Moderno</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#f4f4f4;
}

.container{
  width:95%;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
  font-size:50px;
  color:#0d1b52;
}

/* FILTROS */
.filtros{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.filtros select,
.filtros button{

  padding:15px;
  border-radius:12px;
  border:1px solid #ccc;
  min-width:180px;
  font-size:16px;
}

.filtros button{
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

/* CONTENIDO */
.content{
  display:flex;
  gap:20px;
}

/* MAPA */
#map{
  width:75%;
  height:650px;
  border-radius:20px;
}

/* CARD */
.card{
  width:25%;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-body{
  padding:20px;
}

.precio{
  font-size:42px;
  color:#2563eb;
  font-weight:bold;
  margin:15px 0;
}

.tipo{
  background:#dcfce7;
  color:green;
  display:inline-block;
  padding:8px 15px;
  border-radius:20px;
}

.detalles{
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detalle{
  background:#f3f4f6;
  padding:15px;
  border-radius:10px;
}

.descripcion{
  margin-top:20px;
  color:#666;
  line-height:1.6;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  margin-top:20px;
  cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:1000px){

  .content{
    flex-direction:column;
  }

  #map{
    width:100%;
  }

  .card{
    width:100%;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>Mapa interactivo</h1>

<!-- FILTROS -->
<div class="filtros">

<select id="tipo">
  <option value="todos">Tipo</option>
  <option value="venta">Venta</option>
  <option value="alquiler">Alquiler</option>
  <option value="anticretico">Anticrético</option>
</select>

<select id="zona">
  <option value="todas">Zona</option>
  <option value="centro">Centro</option>
  <option value="norte">Norte</option>
  <option value="sur">Sur</option>
</select>

<button onclick="filtrar()">
Buscar
</button>

</div>

<div class="content">

<!-- MAPA -->
<div id="map"></div>

<!-- CARD DERECHA -->
<div class="card">

<img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200&auto=format&fit=crop">

<div class="card-body">

<div class="tipo">Venta</div>

<div class="precio">
$120.000
</div>

<div class="detalles">

<div class="detalle">
🛏 3 habitaciones
</div>

<div class="detalle">
🚿 2 baños
</div>

<div class="detalle">
📐 240 m²
</div>

<div class="detalle">
🚗 Garaje
</div>

</div>

<p class="descripcion">
Hermosa casa moderna ubicada
en Cala Cala.
</p>

<button class="btn">
Guardar en favoritos
</button>

</div>

</div>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// MAPA
let map = L.map('map').setView([-17.393, -66.157], 13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'OpenStreetMap'
}
).addTo(map);

// DATOS
let propiedades = [

{
 titulo:"Casa Centro",
 tipo:"venta",
 zona:"centro",
 lat:-17.393,
 lng:-66.157,
 color:"green"
},

{
 titulo:"Depa Norte",
 tipo:"alquiler",
 zona:"norte",
 lat:-17.385,
 lng:-66.145,
 color:"blue"
},

{
 titulo:"Casa Sur",
 tipo:"anticretico",
 zona:"sur",
 lat:-17.405,
 lng:-66.170,
 color:"red"
}

];

let markers = [];

// ICONO COLOR
function crearIcono(color){

  return L.divIcon({
    html:`
      <div style="
        background:${color};
        width:18px;
        height:18px;
        border-radius:50%;
        border:3px solid white;
      "></div>
    `,
    className:""
  });

}

// MOSTRAR
function mostrar(data){

  markers.forEach(m => map.removeLayer(m));
  markers=[];

  data.forEach(p=>{

    let marker = L.marker(
      [p.lat,p.lng],
      {
        icon:crearIcono(p.color)
      }
    )
    .addTo(map)
    .bindPopup(`
      <b>${p.titulo}</b><br>
      ${p.tipo}<br>
      Zona: ${p.zona}
    `);

    markers.push(marker);

  });

}

// FILTRO
function filtrar(){

  let tipo =
  document.getElementById("tipo").value;

  let zona =
  document.getElementById("zona").value;

  let filtradas = propiedades.filter(p=>{

    let okTipo =
      tipo==="todos" || p.tipo===tipo;

    let okZona =
      zona==="todas" || p.zona===zona;

    return okTipo && okZona;

  });

  mostrar(filtradas);

}

// INICIO
mostrar(propiedades);

</script>

</body>
</html>
