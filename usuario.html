<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuario | PROP CODE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#f5f7fb;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  height:100vh;
  background:white;
  border-right:1px solid #e5e7eb;
  padding:35px 25px;
  position:fixed;
  left:0;
  top:0;
  overflow:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:50px;
}

.logo-box{
  width:45px;
  height:45px;
  background:#1976ff;
  border-radius:12px;
}

.logo h1{
  font-size:30px;
  font-weight:800;
}

.logo span{
  color:#1976ff;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu a{
  text-decoration:none;
  color:#334155;
  padding:16px 18px;
  border-radius:16px;
  font-weight:600;
  transition:0.3s;
}

.menu a:hover{
  background:#eef5ff;
  color:#1976ff;
}

/* MAIN */

.main{
  margin-left:280px;
  width:calc(100% - 280px);
  padding:30px;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.topbar h2{
  font-size:40px;
  color:#0f172a;
}

.topbar p{
  color:#64748b;
  margin-top:6px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#1976ff;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:700;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.stat-card{
  background:white;
  padding:28px;
  border-radius:26px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.stat-card h3{
  color:#64748b;
  margin-bottom:12px;
}

.stat-card h1{
  font-size:42px;
  color:#1976ff;
}

/* MAPA */

.mapa{
  background:white;
  padding:25px;
  border-radius:32px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.mapa h2{
  font-size:34px;
  margin-bottom:25px;
}

/* MAP */

#map{
  width:100%;
  height:78vh;
  border-radius:28px;
}

/* CARD */

.card-propiedad{
  position:fixed;
  right:25px;
  bottom:25px;
  width:380px;
  background:white;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 15px 45px rgba(0,0,0,0.25);
  z-index:999999;
  display:none;
}

.card-propiedad img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.contenido-card{
  padding:22px;
}

.precio{
  font-size:42px;
  color:#1976ff;
  font-weight:800;
  margin-bottom:10px;
}

.interes{
  color:#ff6b00;
  font-weight:600;
  margin-bottom:20px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.info-item{
  background:#f5f7fb;
  padding:14px;
  border-radius:14px;
}

.descripcion{
  margin-top:20px;
  color:#555;
  line-height:1.7;
}

.btn-favorito{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#1976ff;
  color:white;
  font-weight:700;
  cursor:pointer;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">
    <div class="logo-box"></div>
    <h1>PROP <span>CODE</span></h1>
  </div>

  <div class="menu">
    <a href="#">🏠 Inicio</a>
    <a href="favoritos.html">❤ Favoritos</a>

    <!-- ❌ ALERTAS ELIMINADO -->

    <a href="#">📍 Mapa</a>
    <a href="#">⚖ Comparador</a>
    <a href="#">👤 Perfil</a>
    <a href="#">⚙ Configuración</a>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">

    <div>
      <h2>Bienvenida Adriana 👋</h2>
      <p>Explora propiedades inteligentes en Cochabamba</p>
    </div>

    <div class="avatar">A</div>

  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="stat-card">
      <h3>Favoritos</h3>
      <h1>24</h1>
    </div>

    <!-- ❌ ALERTAS ELIMINADO -->

    <div class="stat-card">
      <h3>Propiedades vistas</h3>
      <h1>132</h1>
    </div>

  </div>

  <!-- MAPA -->
  <section class="mapa">
    <h2>Explora propiedades</h2>
    <div id="map"></div>
  </section>

</div>

<!-- CARD -->
<div class="card-propiedad" id="card"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-17.3935, -66.1570], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'PROP CODE'
}).addTo(map);

const card = document.getElementById("card");

const propiedades = {

  pin1:{
    precio:"$120.000",
    interes:"🔥 84 personas guardaron esta propiedad",
    tipo:"🏠 Casa",
    superficie:"📐 240 m²",
    habitaciones:"🛏 3 habitaciones",
    baños:"🚿 2 baños",
    descripcion:"Hermosa casa moderna ubicada en Cala Cala, Zona Norte.",
    imagen:"https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200"
  },

  pin2:{
    precio:"$3.500",
    interes:"🔥 46 personas guardaron esta propiedad",
    tipo:"🏢 Departamento",
    superficie:"📐 120 m²",
    habitaciones:"🛏 2 habitaciones",
    baños:"🚿 1 baño",
    descripcion:"Departamento moderno en alquiler en la Zona Central.",
    imagen:"https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200"
  },

  pin3:{
    precio:"$95.000",
    interes:"🔥 62 personas guardaron esta propiedad",
    tipo:"🏠 Casa",
    superficie:"📐 300 m²",
    habitaciones:"🛏 4 habitaciones",
    baños:"🚿 3 baños",
    descripcion:"Casa amplia ubicada en la Zona Sur de Cochabamba.",
    imagen:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200"
  }

};

let pinActivo = null;

function mostrarCard(pinId){

  if(pinActivo === pinId){
    card.style.display = "none";
    pinActivo = null;
    return;
  }

  const p = propiedades[pinId];

  card.innerHTML = `
    <img src="${p.imagen}">
    <div class="contenido-card">
      <h2 class="precio">${p.precio}</h2>
      <div class="interes">${p.interes}</div>
      <p class="descripcion">${p.descripcion}</p>
      <button class="btn-favorito">❤ Guardar en favoritos</button>
    </div>
  `;

  card.style.display = "block";
  pinActivo = pinId;
}

/* MARKERS */

L.marker([-17.3835, -66.1500]).addTo(map).on('click',()=>mostrarCard("pin1"));
L.marker([-17.4000, -66.1700]).addTo(map).on('click',()=>mostrarCard("pin2"));
L.marker([-17.3700, -66.1400]).addTo(map).on('click',()=>mostrarCard("pin3"));

</script>

</body>
</html>
