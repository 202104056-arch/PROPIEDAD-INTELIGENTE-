<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuario | PROP CODE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
}

#panel {
  width: 300px;
  height: 100vh;
  overflow-y: auto;
  background: #111;
  color: white;
  padding: 10px;
}

#map {
  flex: 1;
  height: 100vh;
}

.card {
  background: #222;
  padding: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="panel">
  <h3>Filtros</h3>
  <button onclick="filtrar('todos')">Todos</button>
  <button onclick="filtrar('venta')">Venta</button>
  <button onclick="filtrar('alquiler')">Alquiler</button>

  <h3>Propiedades</h3>
  <div id="lista"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ---------------- MAPA ----------------
let map = L.map('map').setView([-17.393, -66.157], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'mapa'
}).addTo(map);

// ---------------- DATOS ----------------
let propiedades = [
  {id:1, titulo:"Casa Centro", tipo:"venta", lat:-17.393, lng:-66.157},
  {id:2, titulo:"Depa Norte", tipo:"alquiler", lat:-17.385, lng:-66.145},
  {id:3, titulo:"Casa Sur", tipo:"venta", lat:-17.405, lng:-66.170}
];

let markers = [];

// ---------------- MOSTRAR ----------------
function mostrar(data){

  document.getElementById("lista").innerHTML = "";

  // limpiar markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  data.forEach(p => {

    // lista
    let div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <b>${p.titulo}</b><br>
      Tipo: ${p.tipo}<br>
      <button onclick="ver(${p.lat},${p.lng})">Ver en mapa</button>
    `;
    document.getElementById("lista").appendChild(div);

    // marker
    let marker = L.marker([p.lat, p.lng])
      .addTo(map)
      .bindPopup(p.titulo);

    markers.push(marker);
  });
}

// ---------------- FILTRO ----------------
function filtrar(tipo){

  if(tipo === "todos"){
    mostrar(propiedades);
  } else {
    let filtradas = propiedades.filter(p => p.tipo === tipo);
    mostrar(filtradas);
  }
}

// ---------------- VER EN MAPA ----------------
function ver(lat,lng){
  map.setView([lat,lng], 15);
}

// inicial
mostrar(propiedades);

</script>

</body>
</html>
