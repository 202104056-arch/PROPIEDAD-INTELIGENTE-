<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuario | PROP CODE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
  margin:0;
  font-family:Poppins;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  height:100vh;
  background:white;
  padding:20px;
  border-right:1px solid #ddd;
}

.sidebar a{
  display:block;
  padding:15px;
  text-decoration:none;
  color:#333;
  font-weight:600;
}

.sidebar a:hover{
  background:#eef5ff;
  color:#1976ff;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
}

#map{
  width:100%;
  height:90vh;
  border-radius:20px;
}

</style>
</head>

<body>

<div class="sidebar">

  <h2>PROP CODE</h2>

  <a href="usuario.html">🏠 Mapa</a>

  <!-- 🔥 FAVORITOS -->
  <a href="favoritos.html">❤ Favoritos</a>

  <!-- 🔥 COMPARADOR -->
  <a href="comparador.html">⚖ Comparador</a>

</div>

<div class="main">
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-17.3935, -66.1570], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'PROP CODE'
}).addTo(map);

/* MARKERS */
L.marker([-17.38,-66.15]).addTo(map).bindPopup("Casa 1");
L.marker([-17.40,-66.17]).addTo(map).bindPopup("Casa 2");
L.marker([-17.37,-66.14]).addTo(map).bindPopup("Casa 3");

</script>

</body>
</html>
